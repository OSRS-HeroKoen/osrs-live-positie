name: Bouwen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bouwen
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: osrs-live-positie
          path: build/libs/osrs-live-positie.jar
      - name: Release met het bestand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete laatste --yes --cleanup-tag || true
          gh release create laatste build/libs/osrs-live-positie.jar --title "Live Positie (laatste)" --notes "Zet osrs-live-positie.jar in de map .runelite/sideloaded-plugins en start RuneLite met --developer-mode."
